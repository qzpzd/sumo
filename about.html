      <p class="kicker">ABOUT</p>
      <h1>关于</h1>
      <p class="lead">一间很小的个人站点。</p>
      <div class="prose">
        <h2>关于这间小屋</h2>
        <p>素墨是一间极简的个人博客。页面取宣纸的颜色，字取墨的深浅，尽量把装饰留在纸外。</p>
        <p>
          文章以 Markdown 存放在 <code>content/posts</code>。后台可以写新篇、改旧篇，也可以把一篇收成草稿。公开的文章会出现在文录、归档、分类、标签和搜索里。
        </p>
        <p>若当天有新文章，早上八点会把标题、摘要和链接送到企业微信群。机器人地址加密后写在代码里，密钥放在本地环境变量中。</p>
        <h2>写给后来的自己</h2>
        <p>慢慢写。写完就好。留白不是空，是还没想说的话。</p>
      </div>
      <p class="back"><a href="./index.html">← 回首页</a></p>
