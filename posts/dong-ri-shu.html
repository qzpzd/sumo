      <h1>冬日的书</h1>
      <p class="lead"><time datetime="2025-12-21">2025年12月21日</time> · 阅读 · 日常</p>
      <div class="prose">
        <p>冬至前后，天色暗得早。灯下翻书，并不打算读完，只想碰到一句愿意停下来的话。</p>
        <h2>读完不是目标</h2>
        <p>
          有的书适合连夜看完，有的书适合在同一页停留。我把后一种放在手边。合上的时候如果还记得那一句，就用铅笔在页边点一个极轻的点，不写批注。
        </p>
        <p>第二年冬天再打开，点还在，句子却常常换成了旁边那一行。这也很好。书没有变，读它的人走过了一年。</p>
