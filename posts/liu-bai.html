      <h1>纸上的留白</h1>
      <p class="lead"><time datetime="2026-03-12">2026年3月12日</time> · 水墨 · 留白</p>
      <div class="prose">
        <p>水墨最难的不是把墨用完，而是知道在哪里停。</p>
        <h2>空白也是结构</h2>
        <p>
          看一张旧画，山只占一角，其余交给雾。雾不是没画，是把远处的层次交给看的人。文章若每一句都说满，读者就没有地方站。
        </p>
        <p>我后来给自己定了三条：</p>
        <ul>
          <li>一段只说一件事</li>
          <li>解释过的比喻就删掉</li>
          <li>结尾不必总结</li>
        </ul>
        <h2>少，然后准</h2>
        <p>
          留白不是偷懒。它要求前面的那一笔足够清楚，后面才敢空着。写代码时删掉的分支，和画里没画的船，是同一种判断。
        </p>
        <blockquote>
          <p>能用一句说完的，就不要写成一节。</p>
        </blockquote>
      </div>
