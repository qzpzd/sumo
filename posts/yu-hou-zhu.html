      <h1>雨后的竹</h1>
      <p class="lead"><time datetime="2026-09-29">2026年9月29日</time> · 竹 · 雨</p>
      <div class="prose">
        <p>夜里下过一场小雨。早晨推窗，竹叶还湿着，叶尖挂着将掉未掉的水。</p>
        <h2>看见的顺序</h2>
        <p>
          先看见颜色。雨把绿色洗深了一度，近处的叶子几乎发黑，远处仍是灰绿。然后才听见水滴打在石上，一声，隔很久又一声。
        </p>
        <p>我想把这个顺序写下来，是因为当时并没有急着拍照。眼睛先记住的东西，通常比镜头更少，也更准。</p>
        <h2>记一天</h2>
        <p>若今天只留一句，就留这句：雨已经停了，叶子还亮着。</p>
        <p>其余的事，明天再写。</p>
