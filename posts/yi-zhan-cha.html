      <h1>一盏茶的时间</h1>
      <p class="lead"><time datetime="2026-06-18">2026年6月18日</time> · 茶 · 日常</p>
      <div class="prose">
        <p>下午把水壶坐上。不是为了解渴，是为了让手里有一件不赶时间的事。</p>
        <h2>三种常见的叶子</h2>
        <table>
          <thead>
            <tr>
              <th>叶子</th>
              <th>水温</th>
              <th>适合</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>绿茶</td>
              <td>八十度上下</td>
              <td>上午，事情还没堆起来</td>
            </tr>
            <tr>
              <td>乌龙</td>
              <td>刚沸</td>
              <td>改完一段之后</td>
            </tr>
            <tr>
              <td>红茶</td>
              <td>沸水</td>
              <td>天色暗下来</td>
            </tr>
          </tbody>
        </table>
        <h2>不必讲究</h2>
        <p>
          杯子可以是普通的白瓷。水可以是烧开后晾一会儿的自来水。要紧的是坐下，看叶子从扁到舒展。
        </p>
        <p>若文章写到一半卡住，就去烧水。等它开的时候，通常已经知道下一句该怎么接。</p>
